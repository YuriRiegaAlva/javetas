name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: javetas-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: javetas-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: javetas-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: javetas-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell Compress-Archive -Path "target/${{ matrix.target }}/release/javetas.exe" -DestinationPath "${{ matrix.asset }}.zip"
            echo "ASSET=${{ matrix.asset }}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" javetas
            echo "ASSET=${{ matrix.asset }}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
